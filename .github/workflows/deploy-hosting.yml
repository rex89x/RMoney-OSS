name: Deploy Hosting & Rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'firebase/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-hosting.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'firebase/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'package.json'
      - 'package-lock.json'

jobs:
  deploy:
    name: Build + Deploy
    # 開源版預設不部署：在 repo Settings → Variables 設 ENABLE_DEPLOY=true 並補齊 secrets 後才會跑（見 docs/CICD_SETUP.md）
    if: vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
          VITE_ADMIN_EMAILS: ${{ vars.VITE_ADMIN_EMAILS }}

      - name: Deploy to Firebase Hosting (live on push / preview on PR)
        # pin 到 commit SHA（v0 tag 2026-11 指向的版本），避免浮動 major 被供應鏈替換
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}

      - name: Install firebase-tools (for rules deploy)
        if: github.event_name == 'push'
        run: npm install -g firebase-tools

      - name: Write service account for rules deploy
        if: github.event_name == 'push'
        env:
          # 不把 secret 內插進 shell 字串（引號 / 特殊字元會壞、也會進 debug log），改走環境變數
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA_JSON" > /tmp/sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore Rules + Indexes (main push only)
        if: github.event_name == 'push'
        run: firebase deploy --only firestore:rules,firestore:indexes --project ${{ secrets.FIREBASE_PROJECT_ID }} --non-interactive

      # Storage rules deploy 會在 firebasestorage.googleapis.com 已啟用後才生效。
      # 預設跳過；待 owner 在 https://console.cloud.google.com/apis/library/firebasestorage.googleapis.com 啟用後，
      # 設定 GitHub repo variable DEPLOY_STORAGE=true 即可開啟。
      - name: Deploy Storage Rules (opt-in)
        if: github.event_name == 'push' && vars.DEPLOY_STORAGE == 'true'
        run: firebase deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_ID }} --non-interactive
